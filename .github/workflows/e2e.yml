name: E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Staging or preview URL (never production)"
        required: true

permissions:
  contents: read

jobs:
  full-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: intimo-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=member-acceptance
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}
          E2E_A_EMAIL: ${{ secrets.E2E_A_EMAIL }}
          E2E_A_PASSWORD: ${{ secrets.E2E_A_PASSWORD }}
          E2E_B_EMAIL: ${{ secrets.E2E_B_EMAIL }}
          E2E_B_PASSWORD: ${{ secrets.E2E_B_PASSWORD }}
          E2E_ALLOWED_ORIGIN: ${{ vars.E2E_ALLOWED_ORIGIN }}
          E2E_A_PRIVATE_MEDIA_ID: ${{ vars.E2E_A_PRIVATE_MEDIA_ID }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: member-acceptance-failure
          path: test-results/
          retention-days: 3
