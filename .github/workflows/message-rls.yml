name: Message RLS
on:
  pull_request:
    paths:
      - supabase/migrations/**
      - tests/sql/**
      - .github/workflows/message-rls.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: intimo_policy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Exercise real PostgreSQL RLS in an empty disposable database
        run: psql -h localhost -U postgres -d intimo_policy_test -f tests/sql/message-rls.sql
        env:
          PGPASSWORD: disposable-test-only
      - name: Verify durable social alerts and existing message eligibility
        run: |
          createdb -h localhost -U postgres intimo_social_test
          awk '/-- Free-plan scheduler/{exit}{print}' supabase/migrations/20261022044018_durable_unread_message_emails.sql > /tmp/intimo-unread-core.sql
          psql -h localhost -U postgres -d intimo_social_test -f tests/sql/social-return-email-disposable.sql
        env:
          PGPASSWORD: disposable-test-only
