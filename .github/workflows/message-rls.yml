name: Message RLS
on:
  pull_request:
    paths:
      - supabase/migrations/**
      - tests/sql/**
      - .github/workflows/message-rls.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: intimo_policy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Exercise real PostgreSQL RLS in an empty disposable database
        run: psql -h localhost -U postgres -d intimo_policy_test -f tests/sql/message-rls.sql
        env:
          PGPASSWORD: disposable-test-only
