<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#191C20">
<title>Intimo · Connection unavailable</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    padding: max(28px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: center;
    background: #191C20; color: #F1E8DC;
    font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 380px; text-align: left; }
  .kicker { color: #A8D5EF; font-size: 11px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; }
  h1 { font-family: "Instrument Serif", Georgia, serif; font-size: clamp(43px, 9vw, 56px); line-height: 1.02; font-weight: 400; letter-spacing: -.02em; margin: 18px 0 16px; }
  p { color: #CFC7BC; font-size: 16px; line-height: 1.65; margin: 0 0 24px; }
  button { appearance: none; background: #E0704F; color: #191C20; border: 1px solid #E0704F; border-radius: 9999px; min-height: 50px; padding: 12px 28px; font: 600 16px system-ui, sans-serif; cursor: pointer; }
  button:focus-visible { outline: 2px solid #A8D5EF; outline-offset: 4px; }
  button:disabled { opacity: .6; cursor: wait; }
  .note { margin-top: 24px; font-size: 13px; color: #A9A39E; }
  @media (prefers-reduced-motion: no-preference) { button { transition: opacity .2s; } button:hover:not(:disabled) { opacity: .88; } }
</style>
</head>
<body>
  <main>
    <div class="kicker">INTIMO · CONNECTION</div>
    <h1>Connection lost.<br>Try again.</h1>
    <p>We couldn't reach Intimo. Check your connection, then try again.</p>
    <button type="button" id="retry">Try again</button>
    <p class="note" role="status" id="status" aria-live="polite">This page contains no personal information.</p>
  </main>
<script>
  (function () {
    var button = document.getElementById("retry");
    var status = document.getElementById("status");
    function retry() {
      button.disabled = true;
      status.textContent = "Reconnecting…";
      window.location.reload();
    }
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) { button.disabled = false; status.textContent = "Try reconnecting to Intimo."; }
    });
    button.addEventListener("click", retry);
    window.addEventListener("online", function () {
      status.textContent = "Connection detected. Reconnecting…";
      window.location.reload();
    });
    window.addEventListener("offline", function () { button.disabled = false; status.textContent = "Still offline. Check your connection."; });
  }());
</script>
</body>
</html>
